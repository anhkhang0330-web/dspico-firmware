name: Build DSpico Firmware
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential git
      - name: Setup Pico SDK
        run: |
          git clone --depth 1 --branch 2.1.1 https://github.com ../pico-sdk
          git -C ../pico-sdk submodule update --init
      - name: Build Firmware
        run: |
          chmod +x compile.sh
          ./compile.sh
      - name: Upload UF2
        uses: actions/upload-artifact@v4
        with:
          name: DSpico-Pokemon-Platinum
          path: build/DSpico.uf2
