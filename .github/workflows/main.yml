name: Build DSpico Firmware
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential git python3
      - name: Setup Pico SDK
        run: |
          rm -rf pico-sdk
          git clone --branch 2.1.1 https://github.com/raspberrypi/pico-sdk.git
          cd pico-sdk
          git submodule update --init
      - name: Build Firmware
        run: |
          mkdir -p build
          export PICO_SDK_PATH=$PWD/pico-sdk
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_POLICY_VERSION_MINIMUM=3.5 .
          cmake --build build -j4
      - name: Upload UF2
        uses: actions/upload-artifact@v4
        with:
          name: DSpico-Pokemon-Platinum
          path: build/*.uf2
